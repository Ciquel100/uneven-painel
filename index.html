<style>
  /* Específico do painel — só tokens, nada cru. */
  /* Deslogado: nada de filtros, abas ou contador — só a porta de entrada. */
  .p-deslogado .p-topbar-actions, .p-deslogado #nav, .p-deslogado .un-tabbar,
  .p-deslogado .p-side-foot .un-seg, .p-deslogado #s-refresh-label, .p-deslogado .p-status { display: none; }
  .p-client { display: flex; flex-direction: column; gap: var(--un-s2); }
  .p-client .un-h3 { font-size: 17px; }
  .p-side-foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--un-s3); }
  .p-status { display: flex; align-items: center; gap: 8px; font: var(--un-mono-sm); color: var(--un-muted); }
  .p-view-title { display: flex; align-items: baseline; gap: var(--un-s3); min-width: 0; }
  .p-view-title .un-label { display: none; }
  .p-count { font: var(--un-mono-sm); color: var(--un-faint); min-width: 60px; text-align: right; }
  .p-icon { width: 18px; height: 18px; flex: none; }
  .p-day { margin-bottom: var(--un-s5); }
  .p-day .un-label { margin-bottom: var(--un-s2); }
  .p-time { font: 700 15px/1 var(--un-font-ui); color: var(--un-txt); min-width: 64px; letter-spacing: var(--un-track-tight); }
  .p-kv { width: 100%; border-collapse: collapse; margin-top: var(--un-s3); }
  .p-kv td { padding: 5px 0; border-bottom: 1px solid var(--un-line-soft); vertical-align: top; font: var(--un-body-md); font-size: 14.5px; }
  .p-kv td:first-child { width: 40%; font: var(--un-label); letter-spacing: var(--un-track-label); text-transform: uppercase; color: var(--un-muted); padding-top: 8px; }
  .p-kv tr:last-child td { border-bottom: 0; }
  .p-card-head { display: flex; justify-content: space-between; gap: var(--un-s3); align-items: flex-start; flex-wrap: wrap; }
  .p-card-foot { display: flex; gap: var(--un-s2); margin-top: var(--un-s4); flex-wrap: wrap; }
  .p-hero { display: flex; align-items: center; gap: var(--un-s4); }
  .p-hero .un-dot { width: 10px; height: 10px; }
  .p-note { font: var(--un-mono-sm); color: var(--un-faint); margin-top: var(--un-s6); line-height: 1.7; }
  .p-topbar-actions { display: flex; align-items: center; gap: var(--un-s3); }
  .p-seg-short { display: none; }
  @media (max-width: 900px) {
    .p-topbar-actions .un-seg > button { padding: 7px 9px; }
    .p-seg-short { display: inline; }
    .p-view-title { flex-direction: column; gap: 2px; }
    .p-view-title .un-label { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
    .p-view-title .un-h3 { white-space: nowrap; }
    .p-hide-m { display: none !important; }
    .p-seg-long { display: none; }
  }
  .p-hide-d { display: none; }
  @media (max-width: 900px) { .p-hide-d { display: initial; } div.p-hide-d { display: block; } div.p-hide-d.un-item__text { display: -webkit-box; } }

<div class="un-app" id="app">
  <aside class="un-side">
    <div class="p-client">
      <p class="un-label" id="s-persona">—</p>
      <h1 class="un-h3" id="s-nome"><span class="un-skel">Carregando o painel</span></h1>
      <p class="un-mono" id="s-sub"></p>
    </div>
    <nav class="un-nav" id="nav"></nav>
    <div class="p-side-foot">
      <p class="un-label" id="s-refresh-label">atualiza a cada</p>
      <div class="un-seg" id="seg-refresh" role="group"></div>
      <div class="p-status"><span class="un-dot" id="s-dot"></span><span id="s-status">—</span></div>
      <a class="un-wordmark" href="https://unevenmedia.com" target="_blank" rel="noopener">Uneven Media</a>
    </div>
  </aside>

  <main class="un-main">
    <header class="un-topbar">
      <div class="p-view-title">
        <p class="un-label" id="t-persona"></p>
        <h2 class="un-h3" id="t-title">—</h2>
      </div>
      <div class="un-topbar__grow"></div>
      <div class="p-topbar-actions">
        <div class="un-seg" id="seg-dias" role="group"></div>
        <button class="un-btn un-btn--ghost un-btn--sm" id="btn-refresh" type="button">
          <svg class="p-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
          <span class="p-hide-m" id="btn-refresh-txt">atualizar</span>
        </button>
        <div class="un-seg" id="seg-cliente" role="group" hidden></div>
        <span class="p-count p-hide-m" id="t-countdown"></span>
      </div>
    </header>
    <div class="un-content" id="view"></div>
  </main>
</div>

    : '/webhook/painel-dados';
  const AUTH = API.replace('painel-dados', 'painel-acesso');
  // Acesso: vem na URL na primeira vez; fora do n8n (origem normal) fica guardado no aparelho,
  // para o app instalado abrir sem o link. ?sair=1 apaga. No n8n (origem opaca) o storage não existe — try/catch.
  // O acesso pode vir na query (?cliente=&token=) ou depois do # — o fragmento não vai
  // para o servidor nem para os logs. Guardar no aparelho é conveniência, nunca a única via:

  // início abre com storage próprio. Por isso existe a tela de colar o link.

    if (Q.get('sair')) { localStorage.removeItem('un-painel'); CLIENTE = ''; TOKEN = ''; }
    else if (CLIENTE && TOKEN) localStorage.setItem('un-painel', JSON.stringify({ cliente: CLIENTE, token: TOKEN }));
    else { const s = JSON.parse(localStorage.getItem('un-painel') || 'null'); if (s && s.cliente && s.token) { CLIENTE = s.cliente; TOKEN = s.token; } }
  } catch (e) {}
  // Sessão do login por código. É o caminho normal; o par cliente+token na URL
  // continua valendo durante a transição e sai de circulação depois.
  const CHAVE_SESSAO = 'un-painel-sessao';
  let SESSAO = null;
  const lerSessao = () => { try { return JSON.parse(localStorage.getItem(CHAVE_SESSAO) || 'null'); } catch (e) { return null; } };
  const gravarSessao = (s) => { try { s ? localStorage.setItem(CHAVE_SESSAO, JSON.stringify(s)) : localStorage.removeItem(CHAVE_SESSAO); } catch (e) {} };
  const sessaoViva = (s) => !!(s && s.token && (!s.expira_em || new Date(s.expira_em).getTime() > Date.now()));
  SESSAO = lerSessao();
  if (SESSAO && !sessaoViva(SESSAO)) { SESSAO = null; gravarSessao(null); }
  if (Q.get('sair')) { SESSAO = null; gravarSessao(null); }
  if (SESSAO) {
    const lista = (SESSAO.clientes || []).map(c => c.cliente_id);
    if (!SESSAO.escolhido || !lista.includes(SESSAO.escolhido)) SESSAO.escolhido = lista[0] || '';

  const t = (k, ...a) => { const v = (T[state.lang] || T.pt)[k]; return typeof v === 'function' ? v(...a) : (v == null ? k : v); };
  const LOCALE = { pt: 'pt-BR', en: 'en-US', es: 'es-US' };

  /* ---------- util ---------- */
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtN = (n) => n == null ? '—' : new Intl.NumberFormat(LOCALE[state.lang] || 'pt-BR').format(n);

  const toDate = (iso) => { if (!iso) return null; const d = new Date(iso); return isNaN(d.getTime()) ? null : d; };
  const fmt = (iso, opts) => { const d = toDate(iso); if (!d) return ''; try { return new Intl.DateTimeFormat(LOCALE[state.lang], Object.assign({ timeZone: tz() }, opts)).format(d); } catch (e) { return ''; } };
  const fmtTime = (iso) => fmt(iso, { hour: '2-digit', minute: '2-digit' });
  const fmtDay = (iso) => fmt(iso, { weekday: 'long', day: 'numeric', month: 'long' });
  const fmtShort = (iso) => fmt(iso, { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const dayKey = (iso) => { const d = toDate(iso); if (!d) return ''; try { return new Intl.DateTimeFormat('en-CA', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: tz() }).format(d); } catch (e) { return ''; } };
  const relDay = (iso) => { const k = dayKey(iso), today = dayKey(new Date().toISOString()); const tom = dayKey(new Date(Date.now() + 864e5).toISOString()); return k && k === today ? t('hoje') : (k && k === tom ? t('amanha') : ''); };
  const fmtClock = (d) => { try { return new Intl.DateTimeFormat(LOCALE[state.lang], { hour: '2-digit', minute: '2-digit' }).format(d); } catch (e) { return ''; } };
  const fmtSeg = (s) => s == null ? '—' : (s < 60 ? Math.round(s * 10) / 10 + ' ' + t('seg') : (s < 3600 ? Math.round(s / 60) + ' min' : Math.round(s / 360) / 10 + ' h'));
  const initials = (n) => String(n || '').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '#';
  const delta = (cur, prev, goodUp) => {

    return '<span class="un-kpi__delta" data-dir="' + dir + '" data-good="' + (goodUp === false ? 'false' : 'true') + '">' + (p > 0 ? '+' : '') + p + '% · ' + esc(t('vsAnterior')) + '</span>';
  };
  const kpi = (label, value, sub, foot) => '<div class="un-card un-kpi"><p class="un-label">' + esc(label) + '</p><div class="un-kpi__value">' + value + '</div>' + (sub || '') + (foot ? '<p class="un-kpi__foot">' + foot + '</p>' : '') + '</div>';
  const statusPill = (c) => {

  /* ---------- navegação ---------- */
  const ICONS = {

    saude: '<svg class="p-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>'

  function views() {

  /* ---------- controles ---------- */
  const segRefresh = () => [2, 5, 15].map(m => '<button type="button" data-ref="' + m + '" aria-pressed="' + (state.refreshMin === m) + '">' + m + ' ' + esc(t('min')) + '</button>').join('');
  const stripMd = (s) => String(s || '').replace(/\*\*|__|`/g, '').replace(/\s+/g, ' ').trim();
  function renderSegs() {
    $('#seg-dias').innerHTML = [7, 14, 30].map(d => '<button type="button" data-dias="' + d + '" aria-pressed="' + (state.dias === d) + '"><span class="p-seg-long">' + esc(t('dias', d)) + '</span><span class="p-seg-short">' + d + 'd</span></button>').join('');
    $('#seg-refresh').innerHTML = segRefresh();
    const sc = $('#seg-cliente');
    const lista = (SESSAO && SESSAO.clientes) || [];
    if (sc) {
      sc.hidden = lista.length < 2;
      sc.innerHTML = lista.length < 2 ? '' : lista.map(c => {
        const nome = (state.data && state.data.cliente && state.data.cliente.id === c.cliente_id && state.data.cliente.nome) || c.cliente_id;
        return '<button type="button" data-cliente="' + esc(c.cliente_id) + '" aria-pressed="' + (CLIENTE === c.cliente_id) + '">' + esc(nome) + '</button>';
      }).join('');

  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-dias]'); if (b) { state.dias = Number(b.dataset.dias); renderSegs(); load(); return; }
    const r = e.target.closest('button[data-ref]'); if (r) { state.refreshMin = Number(r.dataset.ref); renderSegs(); schedule(); renderView(); return; }
    if (e.target.closest('#btn-refresh')) { load(); return; }
    const tc = e.target.closest('button[data-cliente]'); if (tc) { trocarCliente(tc.dataset.cliente); return; }
    if (e.target.closest('#btn-sair')) { sair(); return; }

    const row = e.target.closest('tr[data-href]'); if (row && !e.target.closest('a')) { window.open(row.dataset.href, '_blank', 'noopener'); }
  });
  window.addEventListener('hashchange', () => { renderNav(); renderView(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && state.proxima && Date.now() >= state.proxima) load(); });

  /* ---------- dados ---------- */
  async function load() {
    if (state.loading) return; state.loading = true; setStatus();
    const t0 = Date.now();
    try {
      const url = API + '?cliente=' + encodeURIComponent(CLIENTE) + '&token=' + encodeURIComponent(TOKEN) + '&dias=' + state.dias + '&_=' + t0;
      // A sessão vai no cabeçalho, não na URL: não entra em log de servidor nem em histórico.
      const cab = (SESSAO && SESSAO.token) ? { 'x-painel-sessao': SESSAO.token } : {};
      const r = await fetch(url, { cache: 'no-store', headers: cab });
      if (r.status === 401) {
        state.loading = false; clearTimeout(state.timer); clearInterval(state.tick); state.proxima = null;

      if (!Q.get('lang') && j.cliente && j.cliente.idioma && T[j.cliente.idioma]) { state.lang = j.cliente.idioma; document.documentElement.lang = state.lang; }
    } catch (e) { state.erro = state.data ? 'refresh' : 'load'; }
    state.loading = false;
    try { renderAll(); } catch (e) { console.error(e); } finally { schedule(); }
    // o período mudou enquanto carregava? busca de novo

  }
  function schedule() {
    clearTimeout(state.timer); clearInterval(state.tick);

    state.timer = setTimeout(load, state.refreshMin * 60000);
    state.tick = setInterval(setStatus, 1000); setStatus();
  }
  function setStatus() {
    const dot = $('#s-dot'), st = $('#s-status'), cd = $('#t-countdown');
    if (state.loading) { dot.className = 'un-dot'; st.textContent = t('carregando') + '…'; }
    else if (state.erro === 'semLink') { dot.className = 'un-dot'; st.textContent = t('semLinkCurto'); }
    else if (state.erro === 'auth') { dot.className = 'un-dot un-dot--bad'; st.textContent = t('erroAuth'); }

  }

  /* ---------- entrar ---------- */
  // Login por código de 6 dígitos no e-mail. Sem senha: nada para guardar,
  // nada para esquecer, nada de "esqueci minha senha".
  const login = { etapa: 'email', email: '', erro: '', ocupado: false, mostrarLink: false };

  async function chamarAuth(corpo) {
    const r = await fetch(AUTH, {
      method: 'POST', cache: 'no-store',
      headers: { 'Content-Type': 'application/json' },

  }
  function textoErro(j) {
    const m = {
      email_invalido: t('eEmailInvalido'), codigo_expirado: t('eCodigoExpirado'),
      tentativas_demais: t('eTentativas'), sem_acesso: t('eSemAcesso')

    if (j && j.erro === 'codigo_invalido') {
      return t('eCodigoInvalido') + (typeof j.restam === 'number' && j.restam > 0 ? t('eRestam', j.restam) : '');

    return (j && m[j.erro]) || t('eRede');
  }

  function telaLogin() {
    const naEtapaEmail = login.etapa === 'email';
    let h = '<div class="un-section"><div class="un-card" style="max-width:34rem">';

      h += '<button id="lg-ok" class="un-btn" type="button"' + (login.ocupado ? ' disabled' : '') + '>' + esc(login.ocupado ? t('conferindo') : t('entrar')) + '</button>';

  function ligarLogin() {
    const redesenhar = () => { $('#view').innerHTML = telaLogin(); ligarLogin(); };
    const foco = (sel) => { const el = $(sel); if (el) el.focus(); };

    const pedir = async (email) => {
      login.email = String(email || '').trim().toLowerCase();
      login.erro = ''; login.ocupado = true; redesenhar();
      try {
        const j = await chamarAuth({ acao: 'pedir-codigo', email: login.email });
        login.ocupado = false;
        if (j && j.ok) { login.etapa = 'codigo'; login.erro = ''; }
        else login.erro = textoErro(j);
      } catch (e) { login.ocupado = false; login.erro = t('eRede'); }

    };

    const entrar = async (codigo) => {
      login.erro = ''; login.ocupado = true; redesenhar();
      let j = null;
      try { j = await chamarAuth({ acao: 'entrar', email: login.email, codigo: codigo, aparelho: navigator.userAgent.slice(0, 110) }); }
      catch (e) { j = null; }
      login.ocupado = false;
      if (j && j.ok && j.sessao) {
        const lista = j.clientes || [];
        SESSAO = { token: j.sessao, expira_em: j.expira_em, email: j.email, nome: j.nome, clientes: lista, escolhido: (lista[0] || {}).cliente_id || '' };
        gravarSessao(SESSAO);
        CLIENTE = SESSAO.escolhido; TOKEN = '';
        login.etapa = 'email'; login.erro = '';
        state.erro = null; renderAll(); load();
        return;
      }
      login.erro = textoErro(j);
      if (j && (j.erro === 'codigo_expirado' || j.erro === 'tentativas_demais')) login.etapa = 'email';
      redesenhar(); foco(login.etapa === 'codigo' ? '#lg-codigo' : '#lg-email');
    };

    const be = $('#lg-ok');
    if (be) be.addEventListener('click', () => {

      else entrar((($('#lg-codigo') || {}).value || '').replace(/\D/g, ''));
    });
    ['#lg-email', '#lg-codigo'].forEach(sel => {
      const el = $(sel);
      if (el) el.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') be && be.click(); });
    });
    const br = $('#lg-reenviar'); if (br) br.addEventListener('click', () => pedir(login.email));
    const bv = $('#lg-voltar'); if (bv) bv.addEventListener('click', () => { login.etapa = 'email'; login.erro = ''; redesenhar(); foco('#lg-email'); });
    const bl = $('#lg-tem-link'); if (bl) bl.addEventListener('click', () => { login.mostrarLink = true; redesenhar(); foco('#lk'); });

    const inp = $('#lk'), ok = $('#lk-ok'), err = $('#lk-erro');

      ok.addEventListener('click', tentar);
      inp.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') tentar(); });
    }
  }

  function entrarComLink(txt) {
    const raw = String(txt || '').trim();
    const mc = raw.match(/[?#&]cliente=([^&\s#]+)/i), mt = raw.match(/[?#&]token=([^&\s#]+)/i);
    if (!mc || !mt) return false;
    let c, k;
    try { c = decodeURIComponent(mc[1]); k = decodeURIComponent(mt[1]); } catch (e) { c = mc[1]; k = mt[1]; }
    if (!c || !k) return false;
    CLIENTE = c; TOKEN = k;
    try { localStorage.setItem('un-painel', JSON.stringify({ cliente: c, token: k })); } catch (e) {}
    try { history.replaceState(null, '', location.pathname + '?cliente=' + encodeURIComponent(c) + '&token=' + encodeURIComponent(k) + '#/visao'); } catch (e) {}
    state.erro = null; renderAll(); load(); return true;
  }

  function sair() {
    const token = SESSAO && SESSAO.token;
    SESSAO = null; gravarSessao(null);
    try { localStorage.removeItem('un-painel'); } catch (e) {}

    state.data = null; state.erro = 'semLink';
    clearTimeout(state.timer); clearInterval(state.tick); state.proxima = null;
    login.etapa = 'email'; login.erro = ''; login.ocupado = false; login.mostrarLink = false;
    try { history.replaceState(null, '', location.pathname + '#/visao'); } catch (e) {}
    renderAll();
    if (token) chamarAuth({ acao: 'sair', sessao: token }).catch(() => {});
  }

  function trocarCliente(id) {
    if (!SESSAO || CLIENTE === id) return;
    SESSAO.escolhido = id; gravarSessao(SESSAO);
    CLIENTE = id; state.data = null; state.erro = null;
    renderAll(); load();

  /* ---------- render ---------- */
  function renderAll() {
    const fora = state.erro === 'semLink';
    document.body.classList.toggle('p-deslogado', fora);
    renderSegs(); renderNav();
    if (fora) {
      $('#s-persona').textContent = '';
      $('#s-nome').textContent = t('entrarTit');

      $('#t-persona').textContent = '';
      $('#t-title').textContent = t('entrarTit');

      return;
    }
    const d = state.data;
    if (d) {
      $('#s-persona').textContent = d.cliente.persona + ' · ' + (d.cliente.tipo === 'seguros' ? t('cotacoes') : t('agenda'));
      $('#s-nome').textContent = d.cliente.nome;
      $('#s-sub').textContent = [d.cliente.cidade, d.cliente.tipo_negocio].filter(Boolean).join(' · ');

  }
  function renderView() {
    const v = $('#view'), d = state.data;
    if (state.erro === 'semLink') { v.innerHTML = telaLogin(); ligarLogin(); return; }
    if (state.erro === 'auth') { v.innerHTML = '<div class="un-banner un-banner--bad">' + esc(t('erroAuth')) + '</div>'; return; }
    if (!d) { v.innerHTML = (state.erro ? '<div class="un-section"><div class="un-banner un-banner--bad">' + esc(t('erroCarregar')) + '</div></div>' : '') + skeleton(); return; }
    const cur = currentView();
    const F = d.fontes || {};
    const fontesFalhas = Object.keys(F).filter(k => F[k] === false);
    let html = state.erro ? '<div class="un-section"><div class="un-banner">' + esc(t('erroCarregar')) + '</div></div>' : '';
    if (fontesFalhas.length) html += '<div class="un-section"><div class="un-banner">' + esc(t('fonteFalhou')) + '</div></div>';
    // Regra de honestidade (UNEVEN-CONTEXTO §5): cliente de demonstração aparece rotulado
    if (/-demo$/.test(d.cliente.id) || d.cliente.id === 'bella-miami' || /\(demo\)/i.test(d.cliente.nome)) html += '<p class="un-label" style="margin-bottom:var(--un-s4)">EXAMPLE · FICTIONAL BUSINESS AND NAMES · REAL LAYOUT</p>';
    html += ({ visao: viewVisao, conversas: viewConversas, agenda: viewAgenda, cotacoes: viewCotacoes, saude: viewSaude })[cur](d);
    html += '<p class="p-note">' + esc(t('nota')) + '</p>';
    v.innerHTML = html;
  }
  function skeleton() {
    return '<div class="un-section un-grid un-grid--4">' + [1, 2, 3, 4].map(() => '<div class="un-card un-kpi"><p class="un-label un-skel">xxxxxxxx</p><div class="un-kpi__value un-skel">000</div></div>').join('') + '</div><div class="un-card" style="height:220px"></div>';
  }

  function viewVisao(d) {
    const k = d.kpis, seg = d.cliente.tipo === 'seguros';
    let h = '';
    if (k.aguardando_humano > 0) h += '<div class="un-section"><div class="un-banner"><strong>' + esc(t('esperandoN', k.aguardando_humano)) + '</strong></div></div>';
    h += '<div class="un-section un-grid un-grid--4">';
    h += kpi(t('conversasPeriodo'), fmtN(k.conversas), delta(k.conversas, k.conversas_prev, true));
    h += kpi(t('respondidas'), fmtN(k.respondidas), delta(k.respondidas, k.respondidas_prev, true));
    if (seg) h += kpi(t('prontas'), fmtN(d.cotacoes ? d.cotacoes.prontas.length : null), '<span class="un-kpi__delta">' + fmtN(d.cotacoes ? d.cotacoes.em_coleta.length : 0) + ' ' + esc(t('emColeta')) + '</span>');
    else h += kpi(t('agendamentos'), fmtN(d.agenda ? d.agenda.no_periodo : null), '<span class="un-kpi__delta">' + fmtN(d.agenda ? d.agenda.proximos_7d : 0) + ' · ' + esc(t('prox7')) + '</span>');
    h += kpi(t('transbordos'), fmtN(k.transbordos), delta(k.transbordos, k.transbordos_prev, null));
    h += '</div>';
    h += '<div class="un-section un-grid un-grid--4">';
    h += kpi(t('primeira'), fmtSeg(k.primeira_resposta_seg), delta(k.primeira_resposta_seg, k.primeira_resposta_prev, false));
    h += kpi(t('recebidas'), fmtN(k.recebidas), delta(k.recebidas, k.recebidas_prev, true));
    h += kpi(t('resolvidas'), fmtN(k.resolvidas), delta(k.resolvidas, k.resolvidas_prev, true));
    if (seg) h += kpi(t('comCorretor'), fmtN(d.cotacoes ? d.cotacoes.com_corretor : null), '');
    else h += kpi(t('avaliacoes'), fmtN(d.agenda ? d.agenda.avaliacoes_pedidas : null), '');
    h += '</div>';
    // gráfico + lateral
    const serie = d.serie || [];
    const max = Math.max(1, ...serie.map(s => s.v || 0));
    const todayK = dayKey(new Date().toISOString());
    const labelDia = (dia) => { try { return new Intl.DateTimeFormat(LOCALE[state.lang], serie.length > 14 ? { day: '2-digit', month: '2-digit', timeZone: 'UTC' } : { day: '2-digit', timeZone: 'UTC' }).format(new Date(dia + 'T12:00:00Z')); } catch (e) { return dia.slice(-2); } };
    h += '<div class="un-section un-grid un-grid--main">';
    h += '<div class="un-card"><div class="un-section__head"><p class="un-label">' + esc(t('porDia')) + '</p><span class="un-mono">' + esc(t('dias', d.periodo.dias)) + '</span></div>';
    if (d.fontes && d.fontes.serie === false) h += '<p class="un-empty">' + esc(t('semDados')) + '</p>';
    else {
      h += '<div class="un-bars">' + serie.map(s => '<div style="--v:' + ((s.v || 0) / max).toFixed(3) + '"' + (s.dia === todayK ? ' data-today' : '') + '><i></i><b>' + (s.v || 0) + '</b></div>').join('') + '</div>';
      h += '<div class="un-bars-x">' + serie.map((s, i) => '<span>' + ((serie.length <= 14 || i % 3 === 0) ? esc(labelDia(s.dia)) : '') + '</span>').join('') + '</div>';
    }
    h += '</div>';
    h += '<div class="un-card">';
    if (seg) {
      const pr = (d.cotacoes && d.cotacoes.prontas) || [];
      h += '<div class="un-section__head"><p class="un-label">' + esc(t('prontasCotar')) + '</p><a class="un-mono" href="#/cotacoes">' + esc(t('abrir')) + ' →</a></div>';
      h += pr.length ? '<ul class="un-list">' + pr.slice(0, 6).map(c => '<li class="un-item"><span class="un-avatar">' + esc(initials(c.nome)) + '</span><div><div class="un-item__title">' + esc(c.nome) + '</div><div class="un-item__sub">' + esc(c.ramo) + ' · ' + esc(fmtShort(c.atualizado)) + '</div></div><a class="un-btn un-btn--ghost un-btn--sm" href="' + esc(c.link) + '" target="_blank" rel="noopener">' + esc(t('abrir')) + '</a></li>').join('') + '</ul>' : '<p class="un-empty">' + esc(t('nadaProntas')) + '</p>';
    } else {
      const px = (d.agenda && d.agenda.proximos) || [];
      h += '<div class="un-section__head"><p class="un-label">' + esc(t('proxHorarios')) + '</p><a class="un-mono" href="#/agenda">' + esc(t('abrir')) + ' →</a></div>';
      h += px.length ? '<ul class="un-list">' + px.slice(0, 6).map(e => '<li class="un-item"><span class="p-time">' + esc(fmtTime(e.quando)) + '</span><div><div class="un-item__title">' + esc(e.servico) + (e.nome ? ' — ' + esc(e.nome) : '') + '</div><div class="un-item__sub">' + esc(relDay(e.quando) || fmtDay(e.quando)) + '</div></div><span></span></li>').join('') + '</ul>' : '<p class="un-empty">' + esc(t('nadaProx')) + '</p>';
    }
    h += '</div></div>';
    if (d.aguardando && d.aguardando.length) {
      h += '<div class="un-section"><div class="un-card"><p class="un-label" style="margin-bottom:var(--un-s3)">' + esc(t('esperando')) + '</p><ul class="un-list">' + d.aguardando.map(c => '<li class="un-item"><span class="un-avatar">' + esc(initials(c.nome)) + '</span><div><div class="un-item__title">' + esc(c.nome) + '</div><div class="un-item__text">' + esc(c.ultima) + '</div></div><div><div class="un-item__side">' + esc(fmtShort(c.quando)) + '</div><a class="un-btn un-btn--sm" style="margin-top:6px" href="' + esc(c.link) + '" target="_blank" rel="noopener">' + esc(t('abrir')) + '</a></div></li>').join('') + '</ul></div></div>';
    }
    return h;
  }

  function viewConversas(d) {
    const cs = d.conversas || [];
    if (d.fontes && d.fontes.conversas === false) return '<div class="un-card"><p class="un-empty">' + esc(t('semDados')) + '</p></div>';
    if (!cs.length) return '<div class="un-card"><p class="un-empty">' + esc(t('nadaConversas')) + '</p></div>';
    let h = '<p class="un-mono" style="margin-bottom:var(--un-s3)">' + esc(t('maisRecentes', cs.length)) + '</p><div class="un-card"><table class="un-table"><thead><tr><th>' + esc(t('cliente')) + '</th><th>' + esc(t('status')) + '</th><th class="p-hide-m">' + esc(t('ultima')) + '</th><th class="un-num p-hide-m">' + esc(t('quando')) + '</th><th class="p-hide-m"></th></tr></thead><tbody>';
    h += cs.map(c => '<tr data-href="' + esc(c.link) + '"><td><div class="un-item__title">' + esc(c.nome) + '</div><div class="un-item__sub">' + esc(c.telefone) + (c.nao_lidas ? ' · ' + esc(t('naoLidas', c.nao_lidas)) : '') + '<span class="p-hide-d"> · ' + esc(fmtShort(c.quando)) + '</span></div><div class="un-item__text p-hide-d">' + esc(stripMd(c.ultima)) + '</div></td><td>' + statusPill(c) + '</td><td class="p-hide-m"><div class="un-item__text">' + (c.privada ? '<span class="un-mono">' + esc(t('notaInterna')) + ' · </span>' : '') + esc(stripMd(c.ultima)) + '</div></td><td class="un-num p-hide-m">' + esc(fmtShort(c.quando)) + '</td><td class="un-num p-hide-m"><a class="un-btn un-btn--ghost un-btn--sm" href="' + esc(c.link) + '" target="_blank" rel="noopener">' + esc(t('abrir')) + '</a></td></tr>').join('');
    return h + '</tbody></table></div>';
  }

  function viewAgenda(d) {
    const a = d.agenda || { proximos: [], por_servico: [] };
    let h = '<div class="un-grid un-grid--main">';
    h += '<div class="un-card"><p class="un-label" style="margin-bottom:var(--un-s4)">' + esc(t('proxHorarios')) + '</p>';
    if (!a.proximos.length) h += '<p class="un-empty">' + esc(t('nadaProx')) + '</p>';
    else {
      const groups = {}; a.proximos.forEach(e => { const k = dayKey(e.quando); (groups[k] = groups[k] || []).push(e); });
      h += Object.keys(groups).sort().map(k => { const es = groups[k]; const rd = relDay(es[0].quando); return '<div class="p-day"><p class="un-label">' + esc(fmtDay(es[0].quando)) + (rd ? ' · ' + esc(rd) : '') + '</p><ul class="un-list">' + es.map(e => '<li class="un-item"><span class="p-time">' + esc(fmtTime(e.quando)) + '</span><div><div class="un-item__title">' + esc(e.servico) + '</div><div class="un-item__sub">' + esc(e.nome || '') + '</div></div><span></span></li>').join('') + '</ul></div>'; }).join('');
    }
    h += '</div><div>';
    h += '<div class="un-card" style="margin-bottom:var(--un-s4)"><p class="un-label" style="margin-bottom:var(--un-s3)">' + esc(t('porServico')) + '</p>';
    const mx = Math.max(1, ...a.por_servico.map(s => s.n));
    h += a.por_servico.length ? a.por_servico.map(s => '<div class="un-bar-h" style="--v:' + (s.n / mx).toFixed(3) + '"><span>' + esc(s.nome) + '</span><i></i><b>' + s.n + '</b></div>').join('') : '<p class="un-empty">' + esc(t('nada')) + '</p>';
    h += '</div>';
    h += kpi(t('avaliacoes'), fmtN(a.avaliacoes_pedidas), '');
    return h + '</div></div>';
  }

  function viewCotacoes(d) {
    const c = d.cotacoes || { prontas: [], em_coleta: [], por_ramo: [] };
    const card = (q, pronta) => {
      const val = (v) => (v && typeof v === 'object') ? JSON.stringify(v) : v;
      const dados = (q.dados && typeof q.dados === 'object') ? q.dados : {};
      const linhas = Object.entries(dados).map(([k, v]) => '<tr><td>' + esc(k.replace(/_/g, ' ')) + '</td><td>' + esc(val(v)) + '</td></tr>').join('');
      const texto = Object.entries(dados).map(([k, v]) => k + ': ' + val(v)).join('\n');
      if (!Array.isArray(q.faltando)) q.faltando = [];
      return '<div class="un-card" style="margin-bottom:var(--un-s4)"><div class="p-card-head"><div>' + (pronta ? '<span class="un-pill un-pill--solid">' + esc(t('prontaUma')) + '</span>' : '<span class="un-pill">' + esc(t('emColeta')) + '</span>') + ' <span class="un-h3" style="font-size:16px;margin-left:6px">' + esc(q.ramo || '—') + '</span></div><span class="un-mono">' + esc(q.nome) + ' · ' + esc(q.telefone) + ' · ' + esc(q.idioma) + ' · ' + esc(fmtShort(q.atualizado)) + '</span></div>'
        + '<table class="p-kv">' + (linhas || '<tr><td colspan="2">—</td></tr>') + '</table>'
        + (q.faltando && q.faltando.length ? '<p class="un-mono" style="margin-top:var(--un-s3);color:var(--un-warn)">' + esc(t('faltando')) + ': ' + esc(q.faltando.join(', ')) + (q.followups ? ' · ' + esc(t('cutucada')) : '') + '</p>' : '')
        + '<div class="p-card-foot"><a class="un-btn un-btn--sm" href="' + esc(q.link) + '" target="_blank" rel="noopener">' + esc(t('abrirConversa')) + '</a><button type="button" class="un-btn un-btn--ghost un-btn--sm" data-copy="' + esc(texto) + '">' + esc(t('copiar')) + '</button></div></div>';
    };
    let h = '<div class="un-grid un-grid--main"><div>';
    h += '<p class="un-label" style="margin-bottom:var(--un-s3)">' + esc(t('prontasCotar')) + ' · ' + c.prontas.length + '</p>';
    h += c.prontas.length ? c.prontas.map(q => card(q, true)).join('') : '<div class="un-card" style="margin-bottom:var(--un-s4)"><p class="un-empty">' + esc(t('nadaProntas')) + '</p></div>';
    if (c.em_coleta.length) { h += '<p class="un-label" style="margin:var(--un-s6) 0 var(--un-s3)">' + esc(t('emColeta')) + ' · ' + c.em_coleta.length + '</p>' + c.em_coleta.map(q => card(q, false)).join(''); }
    h += '</div><div>';
    const mx = Math.max(1, ...c.por_ramo.map(s => s.n));
    h += '<div class="un-card" style="margin-bottom:var(--un-s4)"><p class="un-label" style="margin-bottom:var(--un-s3)">' + esc(t('porRamo')) + '</p>' + (c.por_ramo.length ? c.por_ramo.map(s => '<div class="un-bar-h" style="--v:' + (s.n / mx).toFixed(3) + '"><span>' + esc(s.nome) + '</span><i></i><b>' + s.n + '</b></div>').join('') : '<p class="un-empty">' + esc(t('nada')) + '</p>') + '</div>';
    h += kpi(t('comCorretor'), fmtN(c.com_corretor), '');
    return h + '</div></div>';
  }

  function viewSaude(d) {
    const s = d.saude || {}; const semFonte = !!(d.fontes && d.fontes.execucoes === false); const ok = !semFonte && !s.falhas_24h;
    let h = '<div class="un-card" style="margin-bottom:var(--un-s4)"><div class="p-hero"><span class="un-dot ' + (semFonte ? '' : (ok ? 'un-dot--ok un-dot--live' : 'un-dot--warn')) + '"></span><h2 class="un-h2">' + esc(semFonte ? t('sistemaSemDados') : (ok ? t('sistemaOk') : t('sistemaFalhas', s.falhas_24h))) + '</h2></div></div>';
    h += '<div class="un-grid un-grid--3">';
    h += kpi(t('ultimaFalha'), s.ultima_falha ? esc(fmtShort(s.ultima_falha)) : '—', '');
    h += kpi(t('latencia'), state.latencia != null ? fmtN(state.latencia) + '<small>ms</small>' : '—', '');
    h += kpi(t('atualizado'), state.atualizadoEm ? esc(fmtClock(state.atualizadoEm)) : '—', '<span class="un-kpi__delta">' + esc(t('atualiza')) + '</span>', '<span class="un-seg" role="group">' + segRefresh() + '</span>');
    h += '</div>';
    if (SESSAO) {
      h += '<div class="un-card" style="margin-top:var(--un-s4)"><p class="un-label">' + esc(t('conta')) + '</p>'
        + '<p class="un-body" style="margin-top:var(--un-s2)">' + esc(SESSAO.email || '') + '</p>'
        + '<p style="margin-top:var(--un-s3)"><button id="btn-sair" class="un-btn un-btn--ghost un-btn--sm" type="button">' + esc(t('sair')) + '</button></p></div>';
    }
    h += '<div class="un-card" style="margin-top:var(--un-s4)"><p class="un-label">' + esc(t('fonte')) + '</p><p class="un-body" style="margin-top:var(--un-s2)">' + esc(t('fonteTxt')) + '</p></div>';
    if (!STANDALONE && location.protocol !== 'file:') h += '<div class="un-card" style="margin-top:var(--un-s4)"><p class="un-label">' + esc(t('instalar')) + '</p><p class="un-body" style="margin-top:var(--un-s2)">' + esc(t('instalarTxt')) + '</p></div>';
    return h;
  }

  /* ---------- start ---------- */
  renderSegs(); renderNav(); renderView();
  // Sem acesso nenhum (abriu o domínio puro) é diferente de acesso recusado pela API.
  // Entra direto se tem sessão viva (ou um link antigo com token). Senão, tela de login.
  if (SESSAO && CLIENTE) load();
  else if (CLIENTE && TOKEN) load();
  else { state.erro = 'semLink'; renderAll(); }
})();
</script>
</body>
</html>
